name: Automated Football Data Pipeline

on:
  schedule:
    # Runs every day at 02:00 UTC (09:00 AM ICT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest
    environment: CLICKHOUSE_HOST

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install clickhouse-connect statsbombpy httpx pandas python-dotenv

      - name: Run Data Ingestion & ClickHouse Population
        env:
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_HTTP_PORT: ${{ secrets.CLICKHOUSE_HTTP_PORT || secrets.CLICKHOUSE_PORT || '8123' }}
          CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB || 'football_analytics' }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER || 'default' }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_SECURE: ${{ secrets.CLICKHOUSE_SECURE || secrets.CLICKHOUSE_SSL || 'false' }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          echo "🚀 Starting automated ingestion pipeline..."
          python -u data-platform/ingestion/seed_data.py
          echo "✅ Ingestion pipeline completed successfully!"
