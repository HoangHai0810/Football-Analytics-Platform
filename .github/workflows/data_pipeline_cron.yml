name: Automated Football Data Pipeline

on:
  schedule:
    # Runs every 4 hours to sync live/recent match scores & upcoming fixtures
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ đồng bộ dữ liệu (Ingestion Mode)'
        required: true
        default: 'rolling_sync'
        type: choice
        options:
          - 'rolling_sync (Cửa sổ trượt 48h - Trận đấu mới nhất, siêu nhanh)'
          - 'full_backfill (Nạp toàn bộ lịch sử StatsBomb 2015-nay)'

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev openssl ca-certificates

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary>=2.9" statsbombpy httpx pandas python-dotenv

      - name: Validate Secrets & Pre-flight Connectivity Check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT || '5432' }}
        run: |
          # Sanitize secrets
          CLEAN_URL="$(echo -n "$DATABASE_URL" | tr -d '\r\n ')"
          CLEAN_HOST="$(echo -n "$PG_HOST" | tr -d '\r\n ')"
          CLEAN_PORT="$(echo -n "$PG_PORT" | tr -d '\r\n ')"

          # Validate at least one connection method is configured
          if [ -z "$CLEAN_URL" ] && [ -z "$CLEAN_HOST" ]; then
            echo "❌ ERROR: No PostgreSQL connection configured!"
            echo "   Add DATABASE_URL (External URL from Render/Neon/Supabase) to GitHub Secrets."
            echo "   ⚠️  IMPORTANT: Use the EXTERNAL Database URL, not the internal one!"
            echo "   On Render: Dashboard → Your DB → 'External Database URL'"
            exit 1
          fi

          # Extract host from DATABASE_URL if PG_HOST not set
          if [ -n "$CLEAN_URL" ]; then
            CONN_HOST=$(python3 -c "from urllib.parse import urlparse; p=urlparse('$CLEAN_URL'); print(p.hostname or '')" 2>/dev/null || echo "")
            CONN_PORT=$(python3 -c "from urllib.parse import urlparse; p=urlparse('$CLEAN_URL'); print(p.port or 5432)" 2>/dev/null || echo "5432")
          else
            CONN_HOST="$CLEAN_HOST"
            CONN_PORT="${CLEAN_PORT:-5432}"
          fi

          echo "🌐 Target host: $CONN_HOST:$CONN_PORT"

          # Test TCP connectivity
          if ! timeout 10 bash -c "echo > /dev/tcp/$CONN_HOST/$CONN_PORT" 2>/dev/null; then
            echo "❌ TCP connection to $CONN_HOST:$CONN_PORT failed!"
            echo "   This usually means you're using an INTERNAL hostname that only works within Render's network."
            echo "   Fix: Use the EXTERNAL Database URL from your Render Postgres dashboard."
            exit 1
          fi
          echo "✅ TCP connection to $CONN_HOST:$CONN_PORT OK"

          # Test SSL handshake
          echo "" | timeout 10 openssl s_client -connect "$CONN_HOST:$CONN_PORT" -starttls postgres 2>&1 | head -5 || true
          echo "✅ Pre-flight checks passed"

      - name: Run Data Ingestion & PostgreSQL Population
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT || '5432' }}
          PG_DB: ${{ secrets.PG_DB || 'football_analytics' }}
          PG_USER: ${{ secrets.PG_USER || 'postgres' }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_SSL: ${{ secrets.PG_SSL || 'true' }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          INGESTION_MODE: ${{ github.event.inputs.mode || 'rolling_sync' }}
        run: |
          echo "🚀 Starting automated ingestion pipeline..."
          export DATABASE_URL="$(echo -n "$DATABASE_URL" | tr -d '\r\n ')"
          export PG_HOST="$(echo -n "$PG_HOST" | tr -d '\r\n ')"
          export PG_PORT="$(echo -n "$PG_PORT" | tr -d '\r\n ')"

          if [[ "$INGESTION_MODE" == *"full_backfill"* ]]; then
            echo "🌍 [MODE: FULL BACKFILL] Ingesting all StatsBomb historical seasons (2015-present)..."
            python -u data-platform/ingestion/seed_data.py
          else
            echo "⚡ [MODE: ROLLING SYNC] Synchronizing recent 48h live & finished matches..."
            python -u data-platform/ingestion/sync_recent_matches.py
          fi

          echo "✅ Ingestion pipeline step completed successfully!"
