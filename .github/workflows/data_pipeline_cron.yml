name: Automated Football Data Pipeline

on:
  schedule:
    # Runs every day at 02:00 UTC (09:00 AM ICT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary statsbombpy httpx pandas python-dotenv

      - name: Run Data Ingestion & PostgreSQL Population
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT || '5432' }}
          PG_DB: ${{ secrets.PG_DB || 'football_analytics' }}
          PG_USER: ${{ secrets.PG_USER || 'postgres' }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_SSL: ${{ secrets.PG_SSL || 'true' }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          echo "🚀 Starting automated ingestion pipeline..."
          python -u data-platform/ingestion/seed_data.py
          echo "✅ Ingestion pipeline completed successfully!"
