server:
  port: 8000
  servlet:
    context-path: /

spring:
  application:
    name: football-analytics-api
  jackson:
    serialization:
      write-dates-as-timestamps: false

# PostgreSQL — analytics + transactional store
# In production: set via environment variables (Render.com, Docker, etc.)
postgres:
  host: ${PG_HOST:localhost}
  port: ${PG_PORT:5432}
  database: ${PG_DB:football_analytics}
  user: ${PG_USER:postgres}
  password: ${PG_PASSWORD:postgres_dev}
  ssl: ${PG_SSL:false}

# CORS allowed origins (comma-separated, overridable via env)
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:4173"
    - "${FRONTEND_URL:https://football-analytics-platform.vercel.app}"

# Management & Health Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
