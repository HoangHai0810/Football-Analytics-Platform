server:
  port: 8000
  servlet:
    context-path: /

spring:
  application:
    name: football-analytics-api
  jackson:
    serialization:
      write-dates-as-timestamps: false

# PostgreSQL — inside Docker network, host = 'postgres' service
postgres:
  host: ${PG_HOST:postgres}
  port: ${PG_PORT:5432}
  database: ${PG_DB:football_analytics}
  user: ${PG_USER:postgres}
  password: ${PG_PASSWORD:postgres_dev}
  ssl: ${PG_SSL:false}

# CORS — frontend container served on port 3000, also allow dev ports
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://frontend:80"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
