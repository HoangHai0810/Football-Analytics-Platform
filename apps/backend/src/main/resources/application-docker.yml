server:
  port: 8000
  servlet:
    context-path: /

spring:
  application:
    name: football-analytics-api
  jackson:
    serialization:
      write-dates-as-timestamps: false

# ClickHouse OLAP — inside Docker network, host = 'clickhouse' service
clickhouse:
  host: ${CLICKHOUSE_HOST:clickhouse}
  port: ${CLICKHOUSE_PORT:8123}
  database: ${CLICKHOUSE_DB:football_analytics}
  user: ${CLICKHOUSE_USER:default}
  password: ${CLICKHOUSE_PASSWORD:clickhouse_dev}
  socket-timeout-ms: 5000
  connection-timeout-ms: 3000

# CORS — frontend container served on port 3000, also allow dev ports
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://frontend:80"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
