version: 2

models:
  - name: mart_player_season_stats
    description: "Pre-aggregated player statistics by season designed for sub-50ms analytical and API queries"
    columns:
      - name: player_season_key
        description: "Composite surrogate key (player_id_season_id)"
        tests:
          - unique
          - not_null
      - name: player_id
        description: "Player unique identifier"
        tests:
          - not_null
      - name: season_id
        description: "Season unique identifier"
        tests:
          - not_null
      - name: total_matches
        description: "Number of matches played in season"
        tests:
          - not_null
      - name: total_minutes
        description: "Total minutes played"
        tests:
          - not_null

  - name: mart_team_season_stats
    description: "Pre-aggregated team statistics by season for leaderboard, performance metrics, and scouting radar"
    columns:
      - name: team_season_key
        description: "Composite surrogate key (team_id_season_id)"
        tests:
          - unique
          - not_null
      - name: team_id
        description: "Team unique identifier"
        tests:
          - not_null
      - name: season_id
        description: "Season unique identifier"
        tests:
          - not_null
      - name: matches_played
        description: "Number of matches played in season"
        tests:
          - not_null
